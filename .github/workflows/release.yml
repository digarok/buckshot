name: Release Builds
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-and-store-artifact:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]

    steps:
    - uses: actions/checkout@v7
    - uses: ilammy/msvc-dev-cmd@v1
    - uses: jurplel/install-qt-action@v4
      with:
        version: '6.10.*'

    - name: Install Linux build deps
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1-mesa-dev

    - name: Make GNU
      if: matrix.os != 'windows-latest'
      working-directory: ./buckshot
      run: |
        qmake -config release
        make

    - name: Prep Windows (Ico)
      if: matrix.os == 'windows-latest'
      shell: bash
      run: |
        cp assets/icon.ico buckshot
        echo "RC_ICONS = icon.ico" >> buckshot/buckshot.pro

    - name: Make Windows
      if: matrix.os == 'windows-latest'
      working-directory: ./buckshot
      run: |
        qmake -config release
        nmake

    # PACKAGING POST BUILD
    - name: Package OSX
      if: matrix.os == 'macos-latest'
      run: |
        ./package_mac.sh
        pipx install dmgbuild
        dmgbuild -s dmg-settings.json "buckshot" buckshot.dmg

    - name: Package Linux
      if: matrix.os == 'ubuntu-latest'
      run: |
        ./package_linux.sh

    - name: Package Windows
      if: matrix.os == 'windows-latest'
      working-directory: ./buckshot
      run: |
        mkdir buckshot
        cp release\buckshot.exe buckshot
        windeployqt buckshot
        cp ../README.md buckshot
        cp ../LICENSE.txt buckshot
        cp ../assets/examples/* buckshot
        $url = "https://github.com/digarok/b2d/releases/download/v1.5/b2d-windows-latest-v1.5.zip"
        Invoke-WebRequest -Uri $url -OutFile b2d.zip
        7z.exe x b2d.zip
        cp b2d.exe buckshot
        $url = "https://github.com/digarok/cadius/releases/download/0.0.0/cadius-windows-latest-0.0.0.zip"
        Invoke-WebRequest -Uri $url -OutFile cadius.zip
        7z.exe x cadius.zip
        cp build/Src/Debug/Cadius.exe buckshot
        $url = "https://github.com/digarok/image2shr/releases/download/v0.2.0/image2shr-windows-amd64.exe"
        Invoke-WebRequest -Uri $url -OutFile buckshot\image2shr.exe
        7z.exe a buckshot.zip buckshot\*
        mv buckshot.zip ..


    # Store packaged builds from every run so branch pushes are testable
    - name: Upload Mac Artifact
      if: matrix.os == 'macos-latest'
      uses: actions/upload-artifact@v7
      with:
        name: buckshot-macos
        path: buckshot.dmg

    - name: Upload Linux Artifact
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v7
      with:
        name: buckshot-linux
        path: buckshot-linux.zip

    - name: Upload Windows Artifact
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v7
      with:
        name: buckshot-windows
        path: buckshot.zip

    # EVERYTHING BELOW IS ONLY WHEN VERSION TAGS PUSHED (i.e. tag like "v0.1")

    - name: Upload Mac Release
      if: startsWith(github.ref, 'refs/tags/v') && matrix.os == 'macos-latest'
      uses: softprops/action-gh-release@v3
      with:
        files: buckshot.dmg

    - name: Upload Linux Release
      if: startsWith(github.ref, 'refs/tags/v') && matrix.os == 'ubuntu-latest'
      uses: softprops/action-gh-release@v3
      with:
        files: buckshot-linux.zip

    - name: Upload Windows Release
      if: startsWith(github.ref, 'refs/tags/v') && matrix.os == 'windows-latest'
      uses: softprops/action-gh-release@v3
      with:
        files: buckshot.zip
